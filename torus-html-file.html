<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irrational Line Wrapping on Torus</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.85);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 320px;
            z-index: 100;
        }
        h3 {
            margin: 0 0 15px 0;
            font-size: 22px;
            font-weight: 600;
        }
        .control-group {
            margin-bottom: 18px;
        }
        .control-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }
        .control-value {
            color: #ff5252;
            font-weight: 600;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ff5252;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: white;
        }
        .play-button {
            background: #4caf50;
        }
        .pause-button {
            background: #ff5252;
        }
        .reset-button {
            background: #2196f3;
        }
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .preset-btn {
            padding: 6px 12px;
            background: #333;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .preset-btn.active {
            background: #ff5252;
        }
        .info {
            font-size: 11px;
            color: #999;
            margin-top: 15px;
            line-height: 1.5;
        }
        .info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="controls">
        <h3>Line Wrapping on Torus</h3>
        
        <div class="button-group">
            <button id="playPauseBtn" class="play-button">▶ Play</button>
            <button id="resetBtn" class="reset-button">🔄 Reset</button>
        </div>

        <div class="control-group">
            <label class="control-label">
                Slope: <span class="control-value" id="slopeValue">1.414214</span>
            </label>
            <input type="range" id="slopeSlider" min="1" max="5" step="0.01" value="1.414214">
        </div>

        <div class="control-group">
            <label class="control-label">
                Speed: <span class="control-value" style="color: #ffeb3b;" id="speedValue">1</span>x
            </label>
            <input type="range" id="speedSlider" min="0.5" max="5" step="0.5" value="1" style="accent-color: #ffeb3b;">
        </div>

        <div class="control-group">
            <label class="control-label">
                Max Wraps: <span class="control-value" style="color: #2196f3;" id="wrapsValue">100</span>
            </label>
            <input type="range" id="wrapsSlider" min="20" max="200" step="10" value="100" style="accent-color: #2196f3;">
        </div>

        <div class="control-group">
            <div style="font-size: 13px; margin-bottom: 8px; color: #ccc;">Irrational slopes:</div>
            <div class="preset-buttons">
                <button class="preset-btn active" data-value="1.4142135623730951">√2</button>
                <button class="preset-btn" data-value="1.618033988749895">φ</button>
                <button class="preset-btn" data-value="3.141592653589793">π</button>
                <button class="preset-btn" data-value="2.718281828459045">e</button>
                <button class="preset-btn" data-value="1.7320508075688772">√3</button>
            </div>
        </div>

        <div class="info">
            <p>The <span style="color: #ff5252;">red line</span> wraps around the torus with irrational slope, never closing and densely filling the surface.</p>
            <p><span style="color: #ffeb3b;">Yellow dot</span> shows current position.</p>
        </div>
    </div>

    <script>
        // State
        let slope = Math.sqrt(2);
        let maxWraps = 100;
        let isPlaying = false;
        let speed = 1;
        let currentWrap = 0;
        let autoRotate = 0;

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 4, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);

        // Create torus
        const R = 2.5;
        const r = 0.8;
        const torusGeometry = new THREE.TorusGeometry(R, r, 64, 128);
        const torusMaterial = new THREE.MeshStandardMaterial({
            color: 0x2196f3,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide,
            roughness: 0.5,
            metalness: 0.3
        });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        torus.rotation.x = Math.PI / 2;
        scene.add(torus);

        // Wireframe
        const wireframeGeometry = new THREE.TorusGeometry(R, r, 32, 64);
        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0x64b5f6,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });
        const wireframe = new THREE.Mesh(wireframeGeometry, wireframeMaterial);
        wireframe.rotation.x = Math.PI / 2;
        scene.add(wireframe);

        // Line
        const maxPoints = 200 * 200;
        const positions = new Float32Array(maxPoints * 3);
        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        lineGeometry.setDrawRange(0, 0);
        
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff5252, linewidth: 2 });
        const line = new THREE.Line(lineGeometry, lineMaterial);
        line.rotation.x = Math.PI / 2;
        scene.add(line);

        // Point
        const pointGeometry = new THREE.SphereGeometry(0.08, 16, 16);
        const pointMaterial = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
        const point = new THREE.Mesh(pointGeometry, pointMaterial);
        point.rotation.x = Math.PI / 2;
        scene.add(point);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        
        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight1.position.set(5, 5, 5);
        scene.add(directionalLight1);
        
        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
        directionalLight2.position.set(-5, 3, -5);
        scene.add(directionalLight2);

        // Compute point on torus
        function computePoint(t, s) {
            const theta = t;
            const phi = s;
            
            const x = (R + r * Math.cos(phi)) * Math.cos(theta);
            const y = (R + r * Math.cos(phi)) * Math.sin(theta);
            const z = r * Math.sin(phi);
            
            return { x, y, z };
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            if (isPlaying && currentWrap < maxWraps) {
                currentWrap += 0.02 * speed;
                
                const numPoints = Math.floor(currentWrap * 200);
                const positionAttribute = lineGeometry.getAttribute('position');
                
                for (let i = 0; i <= numPoints && i < maxPoints; i++) {
                    const t = (i / 200) * 2 * Math.PI;
                    const s = slope * t;
                    const pos = computePoint(t, s);
                    
                    positionAttribute.setXYZ(i, pos.x, pos.y, pos.z);
                }
                
                positionAttribute.needsUpdate = true;
                lineGeometry.setDrawRange(0, Math.min(numPoints, maxPoints));
                
                if (numPoints > 0) {
                    const t = (numPoints / 200) * 2 * Math.PI;
                    const s = slope * t;
                    const pos = computePoint(t, s);
                    point.position.set(pos.x, pos.y, pos.z);
                }
            }
            
            autoRotate += 0.002;
            torus.rotation.y = autoRotate;
            wireframe.rotation.y = autoRotate;
            line.rotation.y = autoRotate;
            point.rotation.y = autoRotate;
            
            const tilt = Math.sin(autoRotate * 0.3) * 0.2;
            torus.rotation.z = tilt;
            wireframe.rotation.z = tilt;
            line.rotation.z = tilt;
            point.rotation.z = tilt;
            
            renderer.render(scene, camera);
        }
        animate();

        // Controls
        const playPauseBtn = document.getElementById('playPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const slopeSlider = document.getElementById('slopeSlider');
        const speedSlider = document.getElementById('speedSlider');
        const wrapsSlider = document.getElementById('wrapsSlider');
        const slopeValue = document.getElementById('slopeValue');
        const speedValue = document.getElementById('speedValue');
        const wrapsValue = document.getElementById('wrapsValue');

        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playPauseBtn.textContent = '⏸ Pause';
                playPauseBtn.className = 'pause-button';
            } else {
                playPauseBtn.textContent = '▶ Play';
                playPauseBtn.className = 'play-button';
            }
        });

        resetBtn.addEventListener('click', () => {
            currentWrap = 0;
            lineGeometry.setDrawRange(0, 0);
            isPlaying = true;
            playPauseBtn.textContent = '⏸ Pause';
            playPauseBtn.className = 'pause-button';
        });

        slopeSlider.addEventListener('input', (e) => {
            slope = parseFloat(e.target.value);
            slopeValue.textContent = slope.toFixed(6);
            updatePresetButtons();
        });

        speedSlider.addEventListener('input', (e) => {
            speed = parseFloat(e.target.value);
            speedValue.textContent = speed;
        });

        wrapsSlider.addEventListener('input', (e) => {
            maxWraps = parseInt(e.target.value);
            wrapsValue.textContent = maxWraps;
        });

        // Preset buttons
        const presetButtons = document.querySelectorAll('.preset-btn');
        presetButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                slope = parseFloat(btn.dataset.value);
                slopeSlider.value = slope;
                slopeValue.textContent = slope.toFixed(6);
                updatePresetButtons();
            });
        });

        function updatePresetButtons() {
            presetButtons.forEach(btn => {
                const presetValue = parseFloat(btn.dataset.value);
                if (Math.abs(slope - presetValue) < 0.001) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
